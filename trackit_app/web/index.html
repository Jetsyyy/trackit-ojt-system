<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TrackIT: OJT Tracking System of the College of Computer Studies and Technology, Dalubhasaan ng Lunsod ng San Pablo.">
  <meta name="theme-color" content="#6E1423">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrackIT">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>TrackIT</title>
  <link rel="manifest" href="manifest.json">

  <!-- TrackIT loading screen while the app downloads, in two beats: the
       logo pops in, then the school name rises from the bottom into place.
       The app's own splash (lib/widgets/common/trackit_splash.dart) looks the
       same and takes over in its final pose, so nothing plays twice. -->
  <style>
    html, body { margin: 0; height: 100%; background: #4E0E19; }
    #trackit-splash {
      position: fixed; inset: 0; z-index: 9999; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; box-sizing: border-box;
      background: radial-gradient(circle at 50% 42%, #8A1E30 0%, #6E1423 45%, #4E0E19 100%);
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif; text-align: center;
      transition: opacity .45s ease;
    }
    #trackit-splash.hide { opacity: 0; pointer-events: none; }
    /* Beat 1: the logo pops in with a small overshoot, then breathes. */
    #trackit-splash .logo {
      width: 250px; max-width: 56vw; height: auto;
      animation: ts-pop .65s cubic-bezier(.34,1.56,.64,1) both, ts-breath 1.8s ease-in-out 1.7s infinite alternate;
    }
    #trackit-splash .bar {
      position: relative; overflow: hidden; width: 132px; height: 3px; margin-top: 26px;
      border-radius: 3px; background: rgba(255,255,255,.2);
      animation: ts-fade .5s ease .42s both;
    }
    #trackit-splash .bar::after {
      content: ""; position: absolute; top: 0; bottom: 0; width: 46px; left: -46px;
      border-radius: 3px; background: #FF7A1A;
      animation: ts-sweep 1.3s ease-in-out infinite;
    }
    #trackit-splash .tag {
      margin-top: 16px; color: rgba(255,255,255,.8); font-size: 11.5px; font-weight: 600; letter-spacing: 3px;
      animation: ts-fade .5s ease .42s both;
    }
    /* Beat 2: the school name rises from the bottom into the middle. */
    #trackit-splash .school {
      margin-top: 30px; color: rgba(255,255,255,.9); font-size: 13.5px; font-weight: 700; line-height: 1.45;
      animation: ts-rise .82s cubic-bezier(.22,1,.36,1) .88s both;
    }
    #trackit-splash .school span { display: block; margin-top: 3px; color: rgba(255,255,255,.65); font-size: 11.5px; font-weight: 400; }
    @keyframes ts-pop { from { opacity: 0; transform: scale(.55); } 30% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
    @keyframes ts-breath { from { transform: scale(1); } to { transform: scale(1.025); } }
    @keyframes ts-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ts-rise { from { opacity: 0; transform: translateY(260px); } 70% { opacity: 1; } to { opacity: 1; transform: none; } }
    @keyframes ts-sweep { from { left: -46px; } to { left: 132px; } }
    @media (prefers-reduced-motion: reduce) {
      #trackit-splash .logo, #trackit-splash .bar, #trackit-splash .tag, #trackit-splash .school { animation: none; }
    }
  </style>
</head>
<body>
  <div id="trackit-splash" role="status" aria-label="Loading TrackIT">
    <img class="logo" src="icons/trackit-logo-white.png" alt="TrackIT">
    <div class="bar"></div>
    <div class="tag">OJT TRACKING SYSTEM</div>
    <div class="school">Dalubhasaan ng Lunsod ng San Pablo<span>College of Computer Studies and Technology</span></div>
  </div>
  <script>
    // Hand over to the app once it has drawn its first frame AND the intro
    // above has finished (plus a short pause): about 2.2 s after the page
    // started loading. The app shows the same screen underneath.
    (function () {
      var MIN_MS = 2200;
      function hide() {
        var el = document.getElementById('trackit-splash');
        if (!el) return;
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 500);
      }
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, Math.max(0, MIN_MS - performance.now()));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
